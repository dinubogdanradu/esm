name: Build and deploy

on:
  push:
    branches: [deploy]
  pull_request:
    branches: [deploy]
  workflow_dispatch:

# Runs JavaScript actions themselves on Node 24 rather than the runner's default.
# This is separate from the Node used to run the project, which setup-node sets below.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Only read access is needed to build; the deploy job asks for more.
permissions:
  contents: read

# Pages hosts one live site, so let a run finish rather than cancelling it midway
# and leaving a partial deploy.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version the project is developed against.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # GitHub Pages serves a project site from /<repo>/, and vite.config.ts reads
        # the base from this variable. Derived from the repository so a rename or a
        # fork needs no change here. For a <user>.github.io repo, set it to "/".
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests build and test but do not publish: there is a single live site,
    # so deploying a PR would replace production with unreviewed code until the next
    # push to main. Remove this line to publish from pull requests as well.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
